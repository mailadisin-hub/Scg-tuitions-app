  <text x="150" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="white">Sign In</text>

  <!-- Forgot password -->
  <text x="150" y="372" text-anchor="middle" font-size="8" fill="#2840a8">Forgot password?</text>

  <!-- Label -->
  <text x="150" y="550" text-anchor="middle" font-size="10" font-weight="600" fill="white">Login Screen</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SCREEN 2: Parent Chat -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Phone frame -->
  <rect x="330" y="50" width="240" height="500" rx="24" fill="#1a1a2e" stroke="#333" stroke-width="3"/>
  <rect x="338" y="58" width="224" height="484" rx="18" fill="#f4f6ff"/>

  <!-- Header -->
  <rect x="338" y="58" width="224" height="40" rx="0" fill="#141d57"/>
  <rect x="338" y="58" width="224" height="40" rx="18" fill="#141d57"/>
  <rect x="338" y="78" width="224" height="20" fill="#141d57"/>

