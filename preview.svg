<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial,sans-serif">

  <!-- Background -->
  <rect width="900" height="600" fill="#e8eaf0"/>
  <text x="450" y="30" text-anchor="middle" font-size="13" fill="#64748b" font-weight="600">SCG Tuitions — App Preview (New Brand Colours)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SCREEN 1: Login Page -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Phone frame -->
  <rect x="30" y="50" width="240" height="500" rx="24" fill="#1a1a2e" stroke="#333" stroke-width="3"/>
  <rect x="38" y="58" width="224" height="484" rx="18" fill="#141d57"/>
  <!-- Login gradient overlay -->
  <defs>
    <linearGradient id="loginGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141d57"/>
      <stop offset="50%" stop-color="#1e2d7d"/>
      <stop offset="100%" stop-color="#2840a8"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e2d7d"/>
      <stop offset="100%" stop-color="#2840a8"/>
    </linearGradient>
  </defs>
  <rect x="38" y="58" width="224" height="484" rx="18" fill="url(#loginGrad)"/>

  <!-- Login Card -->
  <rect x="54" y="110" width="192" height="370" rx="16" fill="white" opacity="0.97"/>

  <!-- SCG Logo icon -->
  <rect x="122" y="126" width="56" height="56" rx="12" fill="#39b54a"/>
  <text x="150" y="143" text-anchor="middle" font-size="11" font-weight="900" fill="white">SCG</text>
  <text x="150" y="156" text-anchor="middle" font-size="7" font-weight="700" fill="white">Tuitions</text>

  <!-- Login Title -->
  <text x="150" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#141d57">SCG Tuitions</text>
  <text x="150" y="211" text-anchor="middle" font-size="8" fill="#64748b">Personalised Learning for Every Child</text>

  <!-- Tabs -->
  <rect x="64" y="220" width="172" height="26" rx="6" fill="#f4f6ff"/>
  <rect x="66" y="222" width="82" height="22" rx="5" fill="white"/>
  <text x="107" y="237" text-anchor="middle" font-size="9" font-weight="700" fill="#1e2d7d">Sign In</text>
  <text x="193" y="237" text-anchor="middle" font-size="9" fill="#94a3b8">Register</text>

  <!-- Form fields -->
  <text x="68" y="260" font-size="8" font-weight="600" fill="#1e293b">Email address</text>
  <rect x="64" y="264" width="172" height="20" rx="6" fill="white" stroke="#d0d8f5" stroke-width="1.5"/>
  <text x="72" y="278" font-size="8" fill="#94a3b8">you@example.com</text>

  <text x="68" y="296" font-size="8" font-weight="600" fill="#1e293b">Password</text>
  <rect x="64" y="300" width="172" height="20" rx="6" fill="white" stroke="#d0d8f5" stroke-width="1.5"/>
  <text x="72" y="314" font-size="8" fill="#94a3b8">••••••••</text>

  <!-- Sign in button -->
