  <text x="362" y="77" text-anchor="middle" font-size="7" font-weight="900" fill="white">SCG</text>
  <text x="362" y="86" text-anchor="middle" font-size="5" font-weight="700" fill="white">Tuitions</text>

  <text x="384" y="76" font-size="9" font-weight="700" fill="white">SCG Tuitions</text>
  <text x="384" y="87" font-size="7" fill="rgba(255,255,255,0.6)">Parent Portal</text>

