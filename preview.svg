  <rect x="338" y="146" width="80" height="46" fill="#dde3ff"/>
  <rect x="415" y="146" width="3" height="46" fill="#1e2d7d"/>
  <circle cx="354" cy="169" r="12" fill="#1e2d7d"/>
  <text x="354" y="173" text-anchor="middle" font-size="7" font-weight="700" fill="white">MC</text>
  <text x="371" y="160" font-size="7" font-weight="700" fill="#1e293b">Ms Clarke</text>
  <text x="371" y="170" font-size="6" fill="#64748b">Great work Oliver!</text>
  <text x="371" y="182" font-size="6" fill="#94a3b8">2m ago</text>

  <!-- Convo item 2 -->
  <rect x="338" y="192" width="80" height="46" fill="white"/>
  <circle cx="354" cy="215" r="12" fill="#2840a8"/>
