  <circle cx="408" cy="207" r="7" fill="#dc2626"/>
  <text x="408" y="210" text-anchor="middle" font-size="6" font-weight="700" fill="white">2</text>

  <!-- Chat window -->
  <rect x="418" y="126" width="144" height="400" fill="#f0f2ff"/>

  <!-- Chat header -->
  <rect x="418" y="126" width="144" height="32" fill="white" stroke="#d0d8f5" stroke-width="0.5"/>
  <circle cx="432" cy="142" r="10" fill="#1e2d7d"/>
  <text x="432" y="146" text-anchor="middle" font-size="6" font-weight="700" fill="white">MC</text>
  <text x="446" y="138" font-size="8" font-weight="700" fill="#141d57">Ms Clarke</text>
  <text x="446" y="148" font-size="6" fill="#64748b">Teacher</text>

  <!-- Their message bubble -->
  <rect x="424" y="168" width="88" height="36" rx="12" fill="white"/>
