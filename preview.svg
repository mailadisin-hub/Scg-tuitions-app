  <text x="466" y="116" font-size="7" fill="rgba(255,255,255,0.6)">📚</text>
  <text x="474" y="116" font-size="7" fill="rgba(255,255,255,0.6)">HW</text>
  <text x="497" y="116" font-size="7" fill="rgba(255,255,255,0.6)">💳</text>
  <text x="505" y="116" font-size="7" fill="rgba(255,255,255,0.6)">Pay</text>
  <text x="527" y="116" font-size="7" fill="rgba(255,255,255,0.6)">📊</text>
  <text x="536" y="116" font-size="7" fill="rgba(255,255,255,0.6)">+</text>

